[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "xianyu-workbench"
version = "0.1.0"
description = "闲鱼 AI 工作台：搜索、客服草稿、商品发布审批及 Hermes MCP 接口"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "cryptography>=43", "httpx>=0.27,<1", "python-dotenv>=1,<2",
  "python-multipart>=0.0.18", "pillow>=11", "filelock>=3.16,<4"
]

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9", "playwright>=1.64,<1.65", "requests>=2.31,<3"]
live = ["goofish-cli @ git+https://github.com/E-R-Butch/goofish-cli-redux.git@c2d5a02ad83b18863514389cedf7afbd993b683d"]

[project.scripts]
xianyu-workbench = "xianyu_workbench.cli:main"
xianyu-mcp = "xianyu_workbench.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["xianyu_workbench"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 105

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
